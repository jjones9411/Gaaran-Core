<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="80" version="1.1">
  <defs>
    <!-- Gradient: ciemnoszary przechodzący w złoto -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="30%" stop-color="#3b3b3b"/>
      <stop offset="100%" stop-color="#b59a42"/>
    </linearGradient>

    <!-- Delikatna "kamienna" faktura (szum/fractalNoise) -->
    <filter id="noiseFilter">
      <feTurbulence 
        type="fractalNoise" 
        baseFrequency="0.8" 
        numOctaves="1" 
        stitchTiles="stitch" 
        result="noise"
      />
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Prostokąt 1300×80 z gradientem i filtrem szumu -->
  <rect width="1300" height="80" fill="url(#grad)" filter="url(#noiseFilter)" />
</svg>
